# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users: Settings in this file override IDE settings in local.properties.

# Specifies the JVM arguments used for the Gradle Daemon.
# This setting configures the maximum heap size for the Gradle JVM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Enable Gradle build cache to reuse task outputs from previous builds.
org.gradle.caching=true

# Enable experimental configuration cache to speed up configuration time.
org.gradle.configuration-cache=true

# AndroidX package structure enables Jetpack libraries.
android.useAndroidX=true

# Use non-transitive R classes for faster builds and smaller APKs.
android.nonTransitiveRClass=true

# Kotlin code style for the project (official, non-experimental).
kotlin.code.style=official

# Enable incremental processing for Kotlin Symbol Processing (KSP).
ksp.incremental=true
android.experimental.disableJdkImageGeneration=true
